name: Auto merge
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const {owner, repo} = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', head: `${owner}:development`
            });
            for (const pr of prs) {
              if (pr.head.sha !== run.head_sha || pr.head.repo.full_name !== `${owner}/${repo}` || pr.draft) continue;
              const result = await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number, sha: run.head_sha, merge_method: 'merge'
              });
              if (!result.data.merged) throw new Error(result.data.message);
              core.info(`Merged PR #${pr.number}: ${result.data.sha}`);
            }
